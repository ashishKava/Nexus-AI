services:
  postgres:
    image: postgres:17
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: nexus-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RAG_STORE_PATH=/data/rag_store.json
    volumes:
      - nexus_rag_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://nexus:nexus_password@postgres:5432/nexus?schema=public"
      PORT: "4000"
      HOST: "0.0.0.0"
      AI_SERVICE_URL: "http://ai:8000"
      JWT_SECRET: "nexus-production-secret-jwt-key"
      NODE_ENV: "production"
    volumes:
      - nexus_uploads:/app/apps/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexus-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      PORT: "3000"
      NODE_ENV: "production"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

volumes:
  nexus_postgres_data:
  nexus_uploads:
  nexus_rag_data:

networks:
  nexus-network:
    driver: bridge
